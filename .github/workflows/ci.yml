# CI: build the web app and the API server in the runner, then package the
# Docker image from those outputs in the same job.
#
# Everything happens in one job so the built `dist` folders stay on the runner
# and are handed straight to `docker build` — no artifact upload/download.
# The Dockerfile itself stays packaging-only (it installs npm packages and
# copies the outputs in; it builds nothing).
#
# The image is pushed to GHCR (`ghcr.io/<owner>/<repo>`) on pushes to main
# and on semver tags; pull requests only build (no push).

name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            server/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build web
        working-directory: web
        run: npm run build

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      # npm run build = prisma generate && tsc. prisma.config.ts falls back to
      # a placeholder URL when DATABASE_URL is unset, so no database is needed.
      - name: Build server
        working-directory: server
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GHA layer cache keeps rebuilds fast (npm ci layers).
          cache-from: type=gha
          cache-to: type=gha,mode=max
