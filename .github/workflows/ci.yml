# CI: build the web app, build the API server, and package the Docker image
# from those built outputs.
#
# The web/server jobs upload their `dist` folders as artifacts; the docker job
# downloads them into the build context and the Dockerfile only installs npm
# packages and copies the outputs in (no building inside the image).
#
# The image is pushed to GHCR (`ghcr.io/<owner>/<repo>`) on pushes to main
# and on semver tags; pull requests only build (no push).

name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-web:
    name: Build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build
        working-directory: web
        run: npm run build

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  build-server:
    name: Build server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      # npm run build = prisma generate && tsc. prisma.config.ts falls back to
      # a placeholder URL when DATABASE_URL is unset, so no database is needed
      # here.
      - name: Build
        working-directory: server
        run: npm run build

      - name: Upload server build
        uses: actions/upload-artifact@v4
        with:
          name: server-dist
          path: server/dist
          if-no-files-found: error

  docker:
    name: Docker image
    needs: [build-web, build-server]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR
    steps:
      - uses: actions/checkout@v4

      # Reuse the outputs built in the jobs above (the Dockerfile does not
      # build anything — it only installs packages and copies these in).
      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Download server build
        uses: actions/download-artifact@v4
        with:
          name: server-dist
          path: server/dist

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GHA layer cache keeps rebuilds fast (npm ci layers).
          cache-from: type=gha
          cache-to: type=gha,mode=max
